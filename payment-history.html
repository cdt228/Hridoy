
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment History</title>

<style>
/* =========================================
   PAYMENT HISTORY THEME
   INDEX DARK MODE COMPATIBILITY
========================================= */

:root{
  --ph-primary:var(--primary,#087f5b);
  --ph-accent:var(--accent,#12b886);
  --ph-bg:var(--bg,#f5f7fb);
  --ph-card:var(--card,#ffffff);
  --ph-text:var(--text,#172033);
  --ph-muted:var(--muted,#8490a3);
  --ph-border:var(--border,#e8edf3);
  --ph-danger:#e05252;
  --ph-shadow:0 5px 18px rgba(20,40,60,.055);

  --ph-input-bg:var(--input-bg,var(--ph-bg));
  --ph-hover:rgba(8,127,91,.08);
  --ph-selected:rgba(8,127,91,.12);
  --ph-edit-bg:#eaf2ff;
  --ph-edit-text:#2457a6;
  --ph-delete-bg:#fff0f0;
  --ph-delete-text:#c03939;
}

:root[data-theme="dark"],
html[data-theme="dark"],
body[data-theme="dark"],
html.dark,
body.dark,
html.dark-mode,
body.dark-mode,
.dark-mode{
  --ph-bg:var(--bg,#111827);
  --ph-card:var(--card,#1f2937);
  --ph-text:var(--text,#f3f4f6);
  --ph-muted:var(--muted,#9ca3af);
  --ph-border:var(--border,#374151);
  --ph-input-bg:var(--input-bg,#111827);
  --ph-shadow:0 5px 18px rgba(0,0,0,.18);

  --ph-hover:rgba(18,184,134,.13);
  --ph-selected:rgba(18,184,134,.18);
  --ph-edit-bg:#263b59;
  --ph-edit-text:#a9caff;
  --ph-delete-bg:#492b32;
  --ph-delete-text:#ffaaaa;
}

*{box-sizing:border-box}

html,body{min-height:100%}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--ph-bg);
  color:var(--ph-text);
  transition:background .2s,color .2s;
}

button,input,select,textarea{font:inherit}

.ph-wrap{
  width:100%;
  padding:20px;
  max-width:1500px;
  margin:auto;
}

.ph-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.ph-title{font-size:24px;font-weight:800;margin:0 0 5px}
.ph-subtitle{color:var(--ph-muted);font-size:12px}

.ph-refresh{
  border:0;
  background:var(--ph-primary);
  color:white;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.ph-stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:17px;
}

.ph-stat{
  background:var(--ph-card);
  border:1px solid var(--ph-border);
  border-radius:11px;
  padding:13px 15px;
  min-height:88px;
  box-shadow:var(--ph-shadow);
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-width:0;
}

.ph-stat-label{
  font-size:11px;
  color:var(--ph-muted);
  margin-bottom:7px;
  font-weight:600;
  line-height:1.4;
}

.ph-stat-value{
  font-size:21px;
  font-weight:800;
  line-height:1.2;
  word-break:break-word;
  color:var(--ph-text);
}

.ph-panel{
  background:var(--ph-card);
  border:1px solid var(--ph-border);
  border-radius:13px;
  padding:17px;
  box-shadow:var(--ph-shadow);
  margin-bottom:17px;
}

.ph-section-title{
  font-size:15px;
  font-weight:800;
  margin:0 0 14px;
}

.ph-search-row{
  display:flex;
  gap:10px;
  align-items:center;
  width:100%;
  position:relative;
}

.ph-search-wrap{flex:1;min-width:0;position:static}

.ph-search{
  width:100%;
  height:44px;
  border:1px solid var(--ph-border);
  border-radius:8px;
  outline:none;
  padding:0 13px;
  background:var(--ph-input-bg);
  color:var(--ph-text);
  font-size:13px;
}

.ph-search::placeholder{color:var(--ph-muted)}

.ph-search:focus{
  border-color:var(--ph-primary);
  box-shadow:0 0 0 3px rgba(8,127,91,.09);
}

.ph-select-btn{
  height:44px;
  min-width:150px;
  padding:0 14px;
  border:0;
  border-radius:8px;
  background:var(--ph-primary);
  color:white;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.ph-select-btn:hover,.ph-refresh:hover,.ph-view-btn:hover{opacity:.9}

.ph-dropdown{
  display:none;
  position:absolute;
  top:calc(100% + 8px);
  left:0;
  right:0;
  width:100%;
  min-width:0;
  max-width:none;
  max-height:min(65vh,420px);
  overflow-y:auto;
  overflow-x:hidden;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  background:var(--ph-card);
  border:1px solid var(--ph-border);
  border-radius:11px;
  box-shadow:0 12px 35px rgba(0,0,0,.18);
  z-index:999;
  padding:7px;
}

.ph-dropdown.show{display:block}

#phProfileOptions{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.ph-profile-option{
  display:flex;
  flex-direction:row;
  align-items:center;
  gap:11px;
  width:100%;
  min-width:0;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  transition:background .15s;
  flex-shrink:0;
  color:var(--ph-text);
}

.ph-profile-option:hover{background:var(--ph-hover)}
.ph-profile-option.active{background:var(--ph-selected)}

.ph-avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:50%;
  overflow:hidden;
  background:var(--ph-selected);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ph-primary);
  font-size:15px;
  font-weight:800;
}

.ph-avatar img{width:100%;height:100%;object-fit:cover}
.ph-profile-info{min-width:0;flex:1;overflow:hidden}

.ph-profile-name{
  font-size:13px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ph-profile-id{
  font-size:11px;
  color:var(--ph-muted);
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ph-profile-count{
  font-size:11px;
  color:var(--ph-primary);
  font-weight:700;
  white-space:nowrap;
  flex-shrink:0;
}

.ph-dropdown-empty{
  text-align:center;
  padding:20px 10px;
  color:var(--ph-muted);
  font-size:13px;
}

.ph-selected{
  display:none;
  align-items:center;
  gap:12px;
  background:var(--ph-selected);
  border:1px solid var(--ph-border);
  border-radius:10px;
  padding:11px;
  margin-top:13px;
}

.ph-selected.show{display:flex}
.ph-selected-info{flex:1;min-width:0}
.ph-selected-name{font-weight:800;font-size:13px}
.ph-selected-id{color:var(--ph-muted);font-size:11px;margin-top:4px}

.ph-clear{
  border:1px solid var(--ph-border);
  background:var(--ph-card);
  color:var(--ph-text);
  border-radius:7px;
  padding:7px 10px;
  cursor:pointer;
  font-size:11px;
  font-weight:700;
  flex-shrink:0;
}

.ph-history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}

.ph-history-count{color:var(--ph-muted);font-size:11px}

.ph-history-list{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}

.ph-history-card{
  border:1px solid var(--ph-border);
  border-radius:11px;
  padding:14px;
  background:var(--ph-card);
  min-width:0;
}

.ph-card-user{
  display:flex;
  align-items:center;
  gap:10px;
  padding-bottom:12px;
  border-bottom:1px solid var(--ph-border);
}

.ph-card-user-info{flex:1;min-width:0}

.ph-card-user-name{
  font-weight:800;
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.ph-card-user-id{color:var(--ph-muted);font-size:10px;margin-top:4px}

.ph-amount{
  color:var(--ph-primary);
  font-weight:800;
  font-size:18px;
  white-space:nowrap;
}

.ph-details{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  padding:13px 0;
}

.ph-detail-label{font-size:10px;color:var(--ph-muted);margin-bottom:5px}
.ph-detail-value{font-size:12px;font-weight:700;overflow-wrap:anywhere}

.ph-card-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-top:10px;
  border-top:1px solid var(--ph-border);
  flex-wrap:wrap;
}

.ph-date{color:var(--ph-muted);font-size:10px}

.ph-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.ph-action-btn{
  border:0;
  border-radius:7px;
  padding:8px 11px;
  cursor:pointer;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
}

.ph-view-btn{background:var(--ph-primary);color:white}
.ph-edit-btn{background:var(--ph-edit-bg);color:var(--ph-edit-text)}
.ph-delete-btn{background:var(--ph-delete-bg);color:var(--ph-delete-text)}
.ph-action-btn:disabled{opacity:.5;cursor:not-allowed}

.ph-empty{
  text-align:center;
  padding:40px 15px;
  color:var(--ph-muted);
  background:var(--ph-card);
  border:1px dashed var(--ph-border);
  border-radius:11px;
  grid-column:1/-1;
}

.ph-empty-icon{font-size:30px;margin-bottom:10px}

.ph-pagination{
  grid-column:1/-1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  padding:15px 0 3px;
}

.ph-page-btn{
  border:1px solid var(--ph-border);
  border-radius:7px;
  padding:8px 13px;
  background:var(--ph-card);
  color:var(--ph-text);
  cursor:pointer;
  font-size:11px;
  font-weight:700;
}

.ph-page-btn:disabled{opacity:.4;cursor:not-allowed}

.ph-modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,20,30,.65);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.ph-modal.show{display:flex}

.ph-modal-box{
  width:100%;
  max-width:470px;
  max-height:90vh;
  overflow-y:auto;
  background:var(--ph-card);
  color:var(--ph-text);
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:21px;
  animation:phPop .2s ease;
}

@keyframes phPop{
  from{transform:translateY(10px);opacity:0}
  to{transform:translateY(0);opacity:1}
}

.ph-modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.ph-modal-title{font-size:17px;font-weight:800}

.ph-close{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:var(--ph-bg);
  color:var(--ph-text);
  cursor:pointer;
  font-size:19px;
}

.ph-modal-user{
  text-align:center;
  padding:12px 0 18px;
  border-bottom:1px solid var(--ph-border);
}

.ph-modal-avatar{
  width:75px;
  height:75px;
  margin:0 auto 10px;
  border-radius:50%;
  overflow:hidden;
  background:var(--ph-selected);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--ph-primary);
  font-size:25px;
  font-weight:800;
}

.ph-modal-avatar img{width:100%;height:100%;object-fit:cover}
.ph-modal-user-name{font-weight:800;font-size:15px}
.ph-modal-user-id{font-size:11px;color:var(--ph-muted);margin-top:5px}

.ph-modal-amount{text-align:center;padding:18px 0}
.ph-modal-amount-label{font-size:11px;color:var(--ph-muted);margin-bottom:6px}
.ph-modal-amount-value{color:var(--ph-primary);font-size:28px;font-weight:900}

.ph-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}
.ph-modal-item{padding:11px 5px;border-top:1px solid var(--ph-border)}
.ph-modal-label{color:var(--ph-muted);font-size:10px;margin-bottom:6px}
.ph-modal-value{font-size:12px;font-weight:700;overflow-wrap:anywhere}

.ph-modal-done{
  width:100%;
  margin-top:17px;
  border:0;
  border-radius:8px;
  padding:11px;
  background:var(--ph-primary);
  color:white;
  font-weight:800;
  cursor:pointer;
}

.ph-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ph-form-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph-form-field.full{grid-column:1/-1}
.ph-form-field label{font-size:11px;color:var(--ph-muted);font-weight:700}

.ph-form-field input,
.ph-form-field select,
.ph-form-field textarea{
  width:100%;
  min-width:0;
  border:1px solid var(--ph-border);
  border-radius:8px;
  background:var(--ph-input-bg);
  color:var(--ph-text);
  padding:10px 11px;
  font-size:13px;
  outline:none;
  color-scheme:normal;
}

.ph-form-field input:focus,
.ph-form-field select:focus,
.ph-form-field textarea:focus{
  border-color:var(--ph-primary);
  box-shadow:0 0 0 3px rgba(8,127,91,.08);
}

.ph-form-field textarea{min-height:75px;resize:vertical}

.ph-form-actions{display:flex;gap:8px;margin-top:16px}
.ph-form-actions button{
  flex:1;
  border:0;
  border-radius:8px;
  padding:11px;
  font-weight:800;
  cursor:pointer;
}

.ph-cancel-btn{background:var(--ph-bg);color:var(--ph-text)}
.ph-save-btn{background:var(--ph-primary);color:white}
.ph-save-btn:disabled{opacity:.6;cursor:wait}

.ph-loading{text-align:center;padding:35px 10px;color:var(--ph-muted);font-size:13px}
.ph-error{color:var(--ph-danger);background:rgba(224,82,82,.08);padding:13px;border-radius:9px;font-size:13px}

.ph-toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:10001;
  padding:12px 16px;
  border-radius:9px;
  background:#172033;
  color:white;
  font-size:13px;
  box-shadow:0 8px 30px rgba(0,0,0,.2);
  display:none;
  max-width:min(420px,calc(100vw - 36px));
}

.ph-toast.show{display:block}

:root[data-theme="dark"] select,
html.dark select,
body.dark select,
body.dark-mode select,
.dark-mode select{
  color-scheme:dark;
}

@media(max-width:900px){
  .ph-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ph-history-list{grid-template-columns:1fr}
}

@media(max-width:520px){
  .ph-wrap{padding:12px}
  .ph-title{font-size:21px}
  .ph-header{margin-bottom:14px}
  .ph-panel{padding:12px}

  .ph-stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:9px;
    margin-bottom:13px;
  }

  .ph-stat{min-height:76px;padding:11px 12px;border-radius:10px}
  .ph-stat-label{font-size:10px;margin-bottom:6px}
  .ph-stat-value{font-size:18px}

  .ph-search-row{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:9px;
    width:100%;
  }

  .ph-search-wrap{width:100%;flex:none}
  .ph-search{width:100%;height:44px}
  .ph-select-btn{width:100%;min-width:0;height:42px;padding:0 12px;font-size:12px}

  .ph-dropdown{
    top:calc(100% + 7px);
    left:0;
    right:0;
    width:100%;
    min-width:0;
    max-width:none;
    max-height:60vh;
    padding:6px;
    border-radius:10px;
  }

  .ph-profile-option{width:100%;padding:9px 8px;gap:9px}
  .ph-avatar{width:38px;height:38px;flex:0 0 38px}
  .ph-profile-name{font-size:12px}
  .ph-profile-id{font-size:10px}
  .ph-profile-count{font-size:10px}
  .ph-details{gap:10px}
  .ph-modal-box{padding:16px}
  .ph-selected{gap:9px;padding:10px}
  .ph-clear{padding:7px 9px}
  .ph-card-footer{align-items:flex-start}
  .ph-actions{width:100%}
  .ph-action-btn{flex:1}
}

@media(max-width:360px){
  .ph-wrap{padding:9px}
  .ph-panel{padding:10px}
  .ph-stats{gap:7px}
  .ph-stat{min-height:70px;padding:9px 10px}
  .ph-stat-label{font-size:9px}
  .ph-stat-value{font-size:16px}
  .ph-profile-option{gap:7px;padding:9px 6px}
  .ph-profile-count{font-size:9px}
  .ph-avatar{width:36px;height:36px;flex-basis:36px}
  .ph-modal-grid{grid-template-columns:1fr}
  .ph-form-grid{grid-template-columns:1fr}
  .ph-form-field.full{grid-column:auto}
}
</style>
</head>

<body>

<div class="ph-wrap">

  <div class="ph-header">
    <div>
      <h1 class="ph-title">Payment History</h1>
      <div class="ph-subtitle">View and manage payment records</div>
    </div>
    <button class="ph-refresh" id="phRefresh" type="button">↻ Refresh</button>
  </div>

  <div class="ph-stats">
    <div class="ph-stat">
      <div class="ph-stat-label">Total History</div>
      <div class="ph-stat-value" id="phTotalHistory">0</div>
    </div>
    <div class="ph-stat">
      <div class="ph-stat-label">Total Users</div>
      <div class="ph-stat-value" id="phTotalUsers">0</div>
    </div>
    <div class="ph-stat">
      <div class="ph-stat-label">Total Payment Amount</div>
      <div class="ph-stat-value" id="phTotalAmount">৳0</div>
    </div>
    <div class="ph-stat">
      <div class="ph-stat-label">Selected User Records</div>
      <div class="ph-stat-value" id="phSelectedRecords">All</div>
    </div>
  </div>

  <div class="ph-panel">
    <h3 class="ph-section-title">Search Profile</h3>

    <div class="ph-search-row">
      <div class="ph-search-wrap">
        <input type="text" class="ph-search" id="phProfileSearch"
          placeholder="Search profile by name or User ID..."
          autocomplete="off">
        <div class="ph-dropdown" id="phProfileDropdown">
          <div id="phProfileOptions"></div>
        </div>
      </div>

      <button class="ph-select-btn" id="phSelectButton" type="button">
        Select Profile <span>⌄</span>
      </button>
    </div>

    <div class="ph-selected" id="phSelectedProfile">
      <div class="ph-avatar" id="phSelectedAvatar"></div>
      <div class="ph-selected-info">
        <div class="ph-selected-name" id="phSelectedName"></div>
        <div class="ph-selected-id" id="phSelectedId"></div>
      </div>
      <button class="ph-clear" id="phClearProfile" type="button">Clear</button>
    </div>
  </div>

  <div class="ph-panel">
    <div class="ph-history-head">
      <h3 class="ph-section-title" style="margin:0">Payment History Records</h3>
      <div class="ph-history-count" id="phHistoryCount">Loading...</div>
    </div>

    <div class="ph-history-list" id="phHistoryList">
      <div class="ph-loading">Loading payment history...</div>
    </div>
  </div>

</div>

<!-- VIEW MODAL -->
<div class="ph-modal" id="phViewModal">
  <div class="ph-modal-box">
    <div class="ph-modal-head">
      <div class="ph-modal-title">Payment Details</div>
      <button class="ph-close" id="phModalClose" type="button">×</button>
    </div>

    <div class="ph-modal-user">
      <div class="ph-modal-avatar" id="phModalAvatar"></div>
      <div class="ph-modal-user-name" id="phModalName"></div>
      <div class="ph-modal-user-id" id="phModalUserId"></div>
    </div>

    <div class="ph-modal-amount">
      <div class="ph-modal-amount-label">Payment Amount</div>
      <div class="ph-modal-amount-value" id="phModalAmount">৳0</div>
    </div>

    <div class="ph-modal-grid" id="phModalDetails"></div>
    <button class="ph-modal-done" id="phModalDone" type="button">Close</button>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="ph-modal" id="phEditModal">
  <div class="ph-modal-box">
    <div class="ph-modal-head">
      <div class="ph-modal-title">Edit Payment</div>
      <button class="ph-close" id="phEditClose" type="button">×</button>
    </div>

    <form id="phEditForm">
      <input type="hidden" id="phEditPaymentId">

      <div class="ph-form-grid">
        <div class="ph-form-field full">
          <label>User</label>

<script>
"use strict";

/* =====================================================
   API CONFIGURATION
===================================================== */

const PAYMENT_API =
"https://script.google.com/macros/s/AKfycbyQ443c6Ss6TMQgtRGRJflsi7c7WHaChZ4ywnKIJeJ0QlosFh9xzPEjTzWl9iEB44DiMw/exec";

const USER_API =
"https://script.google.com/macros/s/AKfycbwjWuBcXNv5AeeBKC_0-n3_mXoBltK8GFaU7g3otE5JVYrSvKW6hQekc1kla1cuzY9r/exec";


/* =====================================================
   STATE
===================================================== */

let paymentHistory = [];
let allPayments = [];
let allProfiles = [];
let allUsers = [];
let allCurrencies = [];
let allMethods = [];

let selectedUserId = "";
let isDropdownOpen = false;
let historyPage = 1;

const PAGE_SIZE = 25;

const $ = id => document.getElementById(id);


/* =====================================================
   HELPERS
===================================================== */

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function getValue(obj,keys,fallback=""){
  for(const key of keys){
    if(
      obj &&
      obj[key] !== undefined &&
      obj[key] !== null &&
      obj[key] !== ""
    ){
      return obj[key];
    }
  }
  return fallback;
}

function getUserId(x){
  return String(getValue(x,[
    "userId","User ID","userid","user_id","id"
  ],""));
}

function getUserName(x){
  return String(getValue(x,[
    "userName","User Name","name","Name","username"
  ],"Unknown User"));
}

function getProfilePicture(x){
  return String(getValue(x,[
    "profilePicture",
    "Profile Picture",
    "profilePictureUrl",
    "Profile Picture URL",
    "photoURL",
    "photoUrl",
    "imageUrl",
    "image",
    "avatar"
  ],""));
}

function getPaymentId(x){
  return String(getValue(x,[
    "paymentId","Payment ID","payment_id"
  ],"")).trim();
}

function getAmount(x){
  return Number(getValue(x,[
    "paymentAmount",
    "Payment Amount",
    "amount",
    "Amount"
  ],0)) || 0;
}

function getCurrencyId(x){
  return String(getValue(x,[
    "currencyId","Currency ID","currency_id","id"
  ],""));
}

function getCurrencyCode(x){
  return String(getValue(x,[
    "currencyCode","Currency Code","code","Code"
  ],""));
}

function getCurrencyName(x){
  return String(getValue(x,[
    "currencyName","Currency Name","name","Name"
  ],""));
}

function getMethodId(x){
  return String(getValue(x,[
    "paymentMethodId",
    "Payment Method ID",
    "methodId",
    "Method ID",
    "id",
    "ID"
  ],""));
}

function getMethodName(x){
  return String(getValue(x,[
    "paymentMethod",
    "Payment Method",
    "method",
    "Method",
    "name",
    "Name"
  ],""));
}

function money(value){
  return "৳" + Number(value || 0).toLocaleString("en-BD",{
    maximumFractionDigits:2
  });
}

function formatDate(value){
  if(!value) return "—";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return String(value);
  }

  return d.toLocaleDateString("en-GB",{
    day:"2-digit",
    month:"short",
    year:"numeric"
  });
}

function toInputDate(value){
  if(!value) return "";

  const d = new Date(value);

  if(Number.isNaN(d.getTime())){
    return String(value).slice(0,10);
  }

  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function getImageURL(value){
  if(!value) return "";

  let url = String(value).trim();

  if(!url.startsWith("http") && !url.startsWith("data:")){
    return "https://drive.google.com/thumbnail?id=" +
      encodeURIComponent(url) + "&sz=w300";
  }

  const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);

  if(match){
    return "https://drive.google.com/thumbnail?id=" +
      match[1] + "&sz=w300";
  }

  const idMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);

  if(idMatch && url.includes("drive.google.com")){
    return "https://drive.google.com/thumbnail?id=" +
      idMatch[1] + "&sz=w300";
  }

  return url;
}

function avatarHTML(name,picture,extraClass=""){
  const initial = esc(
    String(name || "U").trim().charAt(0).toUpperCase()
  );

  const image = getImageURL(picture);

  if(!image){
    return `<div class="${extraClass}">${initial}</div>`;
  }

  return `
    <div class="${extraClass}">
      <img
        src="${esc(image)}"
        alt="${esc(name)}"
        referrerpolicy="no-referrer"
        onerror="this.parentElement.textContent='${initial}'"
      >
    </div>
  `;
}


/* =====================================================
   JSONP API
===================================================== */

function apiGet(url,timeout=25000){

  return new Promise((resolve,reject)=>{

    const callbackName =
      "__ph_cb_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    const script = document.createElement("script");

    let finished = false;
    let timer;

    function cleanup(){

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

      try{
        delete window[callbackName];
      }catch(e){
        window[callbackName] = undefined;
      }

      clearTimeout(timer);
    }

    function finish(error,data){

      if(finished) return;

      finished = true;
      cleanup();

      if(error){
        reject(error);
      }else{
        resolve(data);
      }
    }

    window[callbackName] = data=>{
      finish(null,data);
    };

    script.onerror = ()=>{
      finish(
        new Error(
          "API connection failed. Check Apps Script deployment."
        )
      );
    };

    const separator = url.includes("?") ? "&" : "?";

    script.src =
      url +
      separator +
      "callback=" + encodeURIComponent(callbackName) +
      "&_=" + Date.now();

    timer = setTimeout(()=>{
      finish(new Error("API response timeout."));
    },timeout);

    document.head.appendChild(script);

  });

}


/* =====================================================
   API ACTION
   Uses GET + JSONP because the Apps Script API
   receives the action from e.parameter.
===================================================== */

async function apiPost(payload){

  const data = {
    ...payload,
    requestId:
      payload.requestId ||
      (
        "ph_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2)
      )
  };

  const query = new URLSearchParams();

  Object.entries(data).forEach(([key,value])=>{

    if(value !== undefined && value !== null){
      query.set(key,String(value));
    }

  });

  // Delete can require additional time because
  // PAYMENT HISTORY sends data to DELETE HISTORY API.
  const timeout =
    payload.action === "deletePayment" ? 90000 : 30000;

  const result = await apiGet(
    PAYMENT_API + "?" + query.toString(),
    timeout
  );

  if(!result || result.success !== true){
    throw new Error(
      result?.message || "API request failed."
    );
  }

  return result;

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;

function showToast(message){

  const toast = $("phToast");

  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(()=>{
    toast.classList.remove("show");
  },3200);

}


/* =====================================================
   LOAD PAYMENT HISTORY
   IMPORTANT:
   PAYMENT HISTORY API supports "payments",
   not "history".
===================================================== */

async function loadPaymentHistory(){

  $("phRefresh").disabled = true;
  $("phRefresh").textContent = "Loading...";

  $("phHistoryList").innerHTML =
    `<div class="ph-loading">Loading payment history...</div>`;

  $("phHistoryCount").textContent = "Loading...";

  try{

    // Correct API action from the supplied Code.gs.
    const historyResponse = await apiGet(
      PAYMENT_API + "?api=payments",
      30000
    );

    if(!historyResponse || historyResponse.success !== true){
      throw new Error(
        historyResponse?.message ||
        "Payment history loading failed."
      );
    }

    const records =
      historyResponse.payments ||
      historyResponse.data ||
      [];

    if(!Array.isArray(records)){
      throw new Error("Invalid payment records response.");
    }

    paymentHistory = records;
    allPayments = records.slice();

    // First show records immediately.
    buildProfiles([]);
    updateSummary();
    renderProfileDropdown();
    renderHistory();

    // Load users, currencies and methods in parallel.
    const results = await Promise.allSettled([

      apiGet(USER_API + "?api=active",25000),

      apiGet(PAYMENT_API + "?api=currencies",25000),

      apiGet(PAYMENT_API + "?api=methods",25000)

    ]);

    if(results[0].status === "fulfilled"){

      const data = results[0].value;

      allUsers =
        data.users ||
        data.data ||
        data.activeUsers ||
        [];

      if(!Array.isArray(allUsers)){
        allUsers = [];
      }

    }

    if(results[1].status === "fulfilled"){

      const data = results[1].value;

      allCurrencies =
        data.currencies ||
        data.data ||
        [];

      if(!Array.isArray(allCurrencies)){
        allCurrencies = [];
      }

    }

    if(results[2].status === "fulfilled"){

      const data = results[2].value;

      allMethods =
        data.methods ||
        data.data ||
        [];

      if(!Array.isArray(allMethods)){
        allMethods = [];
      }

    }

    buildProfiles(allUsers);

    updateSummary();
    renderProfileDropdown();
    renderHistory();

  }catch(error){

    console.error("Payment History:",error);

    $("phHistoryList").innerHTML = `
      <div class="ph-empty">
        <div class="ph-empty-icon">⚠️</div>
        <b>Unable to load payment history</b>
        <p>${esc(error.message)}</p>
      </div>
    `;

    $("phHistoryCount").textContent = "Loading failed";

  }finally{

    $("phRefresh").disabled = false;
    $("phRefresh").textContent = "↻ Refresh";

  }

}


/* =====================================================
   PROFILE DATA
===================================================== */

function buildProfiles(users){

  const map = new Map();

  paymentHistory.forEach(record=>{

    const id = getUserId(record);

    if(!id) return;

    map.set(id,{
      userId:id,
      userName:getUserName(record),
      profilePicture:getProfilePicture(record),
      count:0
    });

  });

  (Array.isArray(users) ? users : []).forEach(user=>{

    const id = getUserId(user);

    if(!id) return;

    const existing = map.get(id);

    if(existing){

      existing.userName =
        getUserName(user) || existing.userName;

      existing.profilePicture =
        getProfilePicture(user) || existing.profilePicture;

    }

  });

  paymentHistory.forEach(record=>{

    const profile = map.get(getUserId(record));

    if(profile){
      profile.count++;
    }

  });

  allProfiles = Array.from(map.values()).sort((a,b)=>
    a.userName.localeCompare(b.userName)
  );

}


/* =====================================================
   SUMMARY
===================================================== */

function updateSummary(){

  const totalAmount = paymentHistory.reduce(
    (sum,record)=>sum + getAmount(record),
    0
  );

  $("phTotalHistory").textContent =
    paymentHistory.length.toLocaleString("en-BD");

  $("phTotalUsers").textContent =
    allProfiles.length.toLocaleString("en-BD");

  $("phTotalAmount").textContent = money(totalAmount);

  updateSelectedCount();

}

function updateSelectedCount(){

  if(!selectedUserId){

    $("phSelectedRecords").textContent = "All";

    return;
  }

  const count = paymentHistory.filter(record=>
    getUserId(record) === selectedUserId
  ).length;

  $("phSelectedRecords").textContent = count;

}


/* =====================================================
   PROFILE DROPDOWN
===================================================== */

function renderProfileDropdown(){

  const search =
    $("phProfileSearch").value.trim().toLowerCase();

  const profiles = allProfiles.filter(profile=>
    profile.userName.toLowerCase().includes(search) ||
    profile.userId.toLowerCase().includes(search)
  );

  let html = `
    <div
      class="ph-profile-option ${!selectedUserId ? "active" : ""}"
      data-user-id=""
    >
      <div class="ph-avatar">ALL</div>

      <div class="ph-profile-info">
        <div class="ph-profile-name">All Profiles</div>
        <div class="ph-profile-id">Show all payment history</div>
      </div>

      <div class="ph-profile-count">${paymentHistory.length}</div>
    </div>
  `;

  profiles.forEach(profile=>{

    html += `
      <div
        class="ph-profile-option ${
          selectedUserId === profile.userId ? "active" : ""
        }"
        data-user-id="${esc(profile.userId)}"
      >

        ${avatarHTML(
          profile.userName,
          profile.profilePicture,
          "ph-avatar"
        )}

        <div class="ph-profile-info">
          <div class="ph-profile-name">
            ${esc(profile.userName)}
          </div>

          <div class="ph-profile-id">
            ${esc(profile.userId)}
          </div>
        </div>

        <div class="ph-profile-count">
          ${profile.count} Payments
        </div>

      </div>
    `;

  });

  if(!profiles.length && search){
    html += `
      <div class="ph-dropdown-empty">
        No matching profile found.
      </div>
    `;
  }

  if(!allProfiles.length){
    html += `
      <div class="ph-dropdown-empty">
        No profiles found.
      </div>
    `;
  }

  $("phProfileOptions").innerHTML = html;

  $("phProfileOptions")
    .querySelectorAll("[data-user-id]")
    .forEach(item=>{

      item.addEventListener("click",()=>{
        selectProfile(item.dataset.userId);
      });

    });

}

function toggleDropdown(force){

  isDropdownOpen =
    typeof force === "boolean" ? force : !isDropdownOpen;

  $("phProfileDropdown")
    .classList.toggle("show",isDropdownOpen);

  if(isDropdownOpen){

    renderProfileDropdown();

    $("phProfileSearch").focus();

  }

}

function selectProfile(userId){

  selectedUserId = String(userId || "");
  historyPage = 1;

  toggleDropdown(false);

  if(selectedUserId){

    const profile = allProfiles.find(
      p=>p.userId === selectedUserId
    );

    if(profile){

      $("phSelectedProfile").classList.add("show");

      $("phSelectedAvatar").innerHTML =
        avatarHTML(
          profile.userName,
          profile.profilePicture,
          "ph-avatar"
        );

      $("phSelectedName").textContent =
        profile.userName;

      $("phSelectedId").textContent =
        "User ID: " + profile.userId;

      $("phProfileSearch").value =
        profile.userName;

      $("phSelectButton").innerHTML =
        "Change Profile <span>⌄</span>";

    }

  }else{

    $("phSelectedProfile").classList.remove("show");

    $("phProfileSearch").value = "";

    $("phSelectButton").innerHTML =
      "Select Profile <span>⌄</span>";

  }

  updateSelectedCount();

  renderProfileDropdown();
  renderHistory();

}


/* =====================================================
   ACTIVE PAYMENT LOOKUP
===================================================== */

function findActivePayment(paymentId){

  const id = String(paymentId || "").trim();

  return allPayments.find(record=>
    getPaymentId(record) === id
  ) || null;

}


/* =====================================================
   RENDER PAYMENT HISTORY
===================================================== */

function renderHistory(){

  let list = paymentHistory.slice();

  if(selectedUserId){

    list = list.filter(record=>
      getUserId(record) === selectedUserId
    );

  }

  list.sort((a,b)=>{

    const da = new Date(getValue(
      a,
      ["createdAt","Created At","paymentDate","Payment Date"],
      0
    )).getTime() || 0;

    const db = new Date(getValue(
      b,
      ["createdAt","Created At","paymentDate","Payment Date"],
      0
    )).getTime() || 0;

    return db-da;

  });

  const total = list.length;

  const pages = Math.max(
    1,
    Math.ceil(total/PAGE_SIZE)
  );

  historyPage = Math.min(
    Math.max(1,historyPage),
    pages
  );

  const start = (historyPage-1)*PAGE_SIZE;

  const pageItems = list.slice(
    start,
    start+PAGE_SIZE
  );

  $("phHistoryCount").textContent =
    `${total} record(s) found · Page ${historyPage} of ${pages}`;

  if(!total){

    $("phHistoryList").innerHTML = `
      <div class="ph-empty">
        <div class="ph-empty-icon">📭</div>
        <b>No Payment History Found</b>
        <p>There are no payment records for this selection.</p>
      </div>
    `;

    return;
  }

  $("phHistoryList").innerHTML = pageItems.map((record,index)=>{

    const userId = getUserId(record);

    const profile = allProfiles.find(
      p=>p.userId === userId
    );

    const userName =
      profile?.userName || getUserName(record);

    const picture =
      profile?.profilePicture || getProfilePicture(record);

    const amount = getAmount(record);

    const method = getValue(
      record,
      ["paymentMethod","Payment Method","method","Method"],
      "—"
    );

    const transaction = getValue(
      record,
      ["transactionId","Transaction ID","transaction_id"],
      "—"
    );

    const date = getValue(
      record,
      ["paymentDate","Payment Date","payment_date"],
      ""
    );

    const paymentId = getPaymentId(record);

    const historyDate = getValue(
      record,
      ["createdAt","Created At","updatedAt","Updated At"],
      ""
    );

    return `
      <div class="ph-history-card">

        <div class="ph-card-user">

          ${avatarHTML(
            userName,
            picture,
            "ph-avatar"
          )}

          <div class="ph-card-user-info">

            <div class="ph-card-user-name">
              ${esc(userName)}
            </div>

            <div class="ph-card-user-id">
              User ID: ${esc(userId)}
            </div>

          </div>

          <div class="ph-amount">
            ${money(amount)}
          </div>

        </div>

        <div class="ph-details">

          <div>
            <div class="ph-detail-label">Payment Method</div>
            <div class="ph-detail-value">${esc(method)}</div>
          </div>

          <div>
            <div class="ph-detail-label">Transaction ID</div>
            <div class="ph-detail-value">${esc(transaction)}</div>
          </div>

          <div>
            <div class="ph-detail-label">Payment Date</div>
            <div class="ph-detail-value">${esc(formatDate(date))}</div>
          </div>

          <div>
            <div class="ph-detail-label">Payment ID</div>
            <div class="ph-detail-value">${esc(paymentId || "—")}</div>
          </div>

        </div>

        <div class="ph-card-footer">

          <div class="ph-date">
            Date: ${esc(formatDate(historyDate))}
          </div>

          <div class="ph-actions">

            <button
              class="ph-action-btn ph-view-btn"
              type="button"
              data-view="${index}"
            >View</button>

            <button
              class="ph-action-btn ph-edit-btn"
              type="button"
              data-edit="${index}"
              ${!findActivePayment(paymentId) ? "disabled" : ""}
            >Edit</button>

            <button
              class="ph-action-btn ph-delete-btn"
              type="button"
              data-delete="${index}"
              ${!findActivePayment(paymentId) ? "disabled" : ""}
            >Delete</button>

          </div>

        </div>

      </div>
    `;

  }).join("");


  /* PAGINATION */

  if(pages > 1){

    $("phHistoryList").insertAdjacentHTML(
      "beforeend",
      `
        <div class="ph-pagination">

          <button
            class="ph-page-btn"
            id="phPrev"
            ${historyPage===1?"disabled":""}
          >Previous</button>

          <span style="font-size:12px;color:var(--ph-muted)">
            Page ${historyPage} of ${pages}
          </span>

          <button
            class="ph-page-btn"
            id="phNext"
            ${historyPage===pages?"disabled":""}
          >Next</button>

        </div>
      `
    );

    $("phPrev").addEventListener("click",()=>{
      historyPage--;
      renderHistory();
    });

    $("phNext").addEventListener("click",()=>{
      historyPage++;
      renderHistory();
    });

  }


  /* VIEW EVENTS */

  $("phHistoryList")
    .querySelectorAll("[data-view]")
    .forEach(button=>{

      button.addEventListener("click",()=>{

        const record =
          pageItems[Number(button.dataset.view)];

        openPaymentDetails(record);

      });

    });


  /* EDIT EVENTS */

  $("phHistoryList")
    .querySelectorAll("[data-edit]")
    .forEach(button=>{

      button.addEventListener("click",()=>{

        const record =
          pageItems[Number(button.dataset.edit)];

        openEditPayment(record);

      });

    });


  /* DELETE EVENTS */

  $("phHistoryList")
    .querySelectorAll("[data-delete]")
    .forEach(button=>{

      button.addEventListener("click",()=>{

        const record =
          pageItems[Number(button.dataset.delete)];

        deletePayment(record);

      });

    });

}


/* =====================================================
   VIEW PAYMENT
===================================================== */

function openPaymentDetails(record){

  const userId = getUserId(record);

  const profile = allProfiles.find(
    p=>p.userId===userId
  );

  const userName =
    profile?.userName || getUserName(record);

  const picture =
    profile?.profilePicture || getProfilePicture(record);

  const amount = getAmount(record);

  $("phModalAvatar").innerHTML =
    avatarHTML(
      userName,
      picture,
      "ph-modal-avatar"
    );

  $("phModalName").textContent = userName;

  $("phModalUserId").textContent =
    "User ID: " + userId;

  $("phModalAmount").textContent =
    money(amount);

  const details = [

    [
      "Payment ID",
      getPaymentId(record) || "—"
    ],

    [
      "Payment Method",
      getMethodName(record) || "—"
    ],

    [
      "Transaction ID",
      getValue(record,[
        "transactionId","Transaction ID"
      ],"—")
    ],

    [
      "Payment Date",
      formatDate(getValue(record,[
        "paymentDate","Payment Date"
      ],""))
    ],

    [
      "Currency",
      getCurrencyName(record) ||
      getCurrencyCode(record) ||
      "—"
    ],

    [
      "Created At",
      formatDate(getValue(record,[
        "createdAt","Created At"
      ],""))
    ],

    [
      "Updated At",
      formatDate(getValue(record,[
        "updatedAt","Updated At"
      ],""))
    ],

    [
      "Comment",
      getValue(record,[
        "comment","Comment","description"
      ],"—")
    ]

  ];

  $("phModalDetails").innerHTML =
    details.map(item=>`

      <div class="ph-modal-item">

        <div class="ph-modal-label">
          ${esc(item[0])}
        </div>

        <div class="ph-modal-value">
          ${esc(item[1])}
        </div>

      </div>

    `).join("");

  $("phViewModal").classList.add("show");

}

function closePaymentModal(){
  $("phViewModal").classList.remove("show");
}


/* =====================================================
   SELECT OPTION BUILDER
===================================================== */

function fillSelect(
  selectId,
  items,
  valueFunction,
  labelFunction,
  selectedValue,
  extraFunction
){

  const select = $(selectId);

  const selected = String(selectedValue ?? "");

  let html = `<option value="">Select...</option>`;

  items.forEach(item=>{

    const value = String(valueFunction(item) ?? "");

    const label = String(labelFunction(item) ?? value);

    if(!value) return;

    const extra = extraFunction
      ? extraFunction(item)
      : {};

    const dataAttributes = Object.entries(extra)
      .map(([key,val])=>
        `data-${key}="${esc(val)}"`
      )
      .join(" ");

    html += `
      <option
        value="${esc(value)}"
        ${value===selected?"selected":""}
        ${dataAttributes}
      >${esc(label)}</option>
    `;

  });

  select.innerHTML = html;

}


/* =====================================================
   OPEN EDIT MODAL
===================================================== */

function openEditPayment(historyRecord){

  const paymentId = getPaymentId(historyRecord);

  const payment = findActivePayment(paymentId);

  if(!payment){

    showToast("Active payment record not found.");

    return;
  }

  $("phEditPaymentId").value = paymentId;


  /* USER OPTIONS */

  const userList = allUsers.length
    ? allUsers
    : allProfiles;

  fillSelect(
    "phEditUser",
    userList,

    item=>getUserId(item),

    item=>getUserName(item),

    getUserId(payment),

    item=>({
      username:getUserName(item)
    })
  );


  /* CURRENCY OPTIONS */

  fillSelect(
    "phEditCurrency",
    allCurrencies,

    item=>getCurrencyId(item),

    item=>{
      const name = getCurrencyName(item);
      const code = getCurrencyCode(item);
      return name && code ? name+" ("+code+")" : name || code;
    },

    getCurrencyId(payment),

    item=>({
      code:getCurrencyCode(item),
      name:getCurrencyName(item)
    })
  );


  /* PAYMENT METHOD OPTIONS */

  fillSelect(
    "phEditMethod",
    allMethods,

    item=>getMethodId(item),

    item=>getMethodName(item),

    getMethodId(payment),

    item=>({
      method:getMethodName(item)
    })
  );


  $("phEditAmount").value = getAmount(payment);

  $("phEditDate").value = toInputDate(
    getValue(payment,[
      "paymentDate","Payment Date","payment_date"
    ],"")
  );

  $("phEditTransaction").value = getValue(
    payment,
    ["transactionId","Transaction ID","transaction_id"],
    ""
  );

  $("phEditComment").value = getValue(
    payment,
    ["comment","Comment"],
    ""
  );

  $("phEditModal").classList.add("show");

}

function closeEditModal(){
  $("phEditModal").classList.remove("show");
}


/* =====================================================
   SAVE EDIT PAYMENT
   Sends all related IDs and names to Code.gs.
===================================================== */

async function submitEditPayment(event){

  event.preventDefault();

  const button = $("phEditSave");

  if(button.disabled) return;

  const userOption =
    $("phEditUser").selectedOptions[0];

  const currencyOption =
    $("phEditCurrency").selectedOptions[0];

  const methodOption =
    $("phEditMethod").selectedOptions[0];


  const userId = $("phEditUser").value;

  const userName =
    userOption?.dataset.username || "";


  const currencyId =
    $("phEditCurrency").value;

  const currencyCode =
    currencyOption?.dataset.code || "";

  const currencyName =
    currencyOption?.dataset.name || "";


  const paymentMethodId =
    $("phEditMethod").value;

  const paymentMethod =
    methodOption?.dataset.method || "";


  const payload = {

    action:"editPayment",

    paymentId:$("phEditPaymentId").value,

    userId:userId,

    userName:userName,

    paymentAmount:$("phEditAmount").value,

    paymentDate:$("phEditDate").value,

    currencyId:currencyId,

    currencyCode:currencyCode,

    currencyName:currencyName,

    paymentMethodId:paymentMethodId,

    paymentMethod:paymentMethod,

    transactionId:$("phEditTransaction").value,

    comment:$("phEditComment").value

  };


  if(
    !payload.paymentId ||
    !payload.userId ||
    !payload.currencyId ||
    !payload.paymentMethodId ||
    !(Number(payload.paymentAmount)>0) ||
    !payload.paymentDate
  ){

    showToast("Please complete all required fields.");

    return;
  }


  button.disabled = true;
  button.textContent = "Saving...";

  try{

    const result = await apiPost(payload);

    if(result.success !== true){

      throw new Error(
        result.message || "Payment update failed."
      );

    }

    closeEditModal();

    showToast("Payment updated successfully.");

    await loadPaymentHistory();

  }catch(error){

    console.error("Edit Payment:",error);

    showToast(
      error.message || "Payment update failed."
    );

  }finally{

    button.disabled = false;
    button.textContent = "Save Changes";

  }

}


/* =====================================================
   DELETE PAYMENT
   PAYMENT HISTORY API moves it to DELETE HISTORY.
===================================================== */

async function deletePayment(record){

  const paymentId = getPaymentId(record);

  if(!paymentId){

    showToast("Payment ID is missing.");

    return;
  }

  if(!findActivePayment(paymentId)){

    showToast("Active payment not found.");

    return;
  }

  const userName = getUserName(record);

  const amount = money(getAmount(record));

  const confirmed = confirm(

    "Delete this payment?\n\n" +

    "User: " + userName + "\n" +

    "Amount: " + amount + "\n\n" +

    "It will be moved to DELETE HISTORY."

  );

  if(!confirmed) return;


  const buttons = Array.from(
    document.querySelectorAll("[data-delete]")
  );

  buttons.forEach(button=>{
    button.disabled = true;
  });

  try{

    const result = await apiPost({

      action:"deletePayment",

      paymentId:paymentId

    });

    if(result.success !== true){

      throw new Error(
        result.message || "Payment delete failed."
      );

    }

    showToast(
      "Payment moved to DELETE HISTORY successfully."
    );

    await loadPaymentHistory();

  }catch(error){

    console.error("Delete Payment:",error);

    showToast(
      error.message || "Payment delete failed."
    );

    buttons.forEach(button=>{
      button.disabled = false;
    });

  }

}
